name: E2E
# Genera un proyecto real con cada app de arranque y comprueba que TODO lo generado funciona:
# los comandos del ci.yml, los evals del hook, el Dockerfile y el docker compose.
on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: que stacks probar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then files=$(git diff --name-only "$BASE" HEAD); fi
          matrix=$(python3 tools/e2e_plan.py "${{ github.event_name }}" $files)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
  project:
    name: e2e (${{ matrix.stack }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Instalar utilidades
        run: pip install pyyaml
      - name: Generar el proyecto
        run: |
          python3 starterkit.py --stack "${{ matrix.stack }}" --db postgres --cloud aws --with-app \
            --out "$RUNNER_TEMP/proj"
      - name: Postgres para los tests (el equivalente al service del ci.yml)
        if: matrix.db
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=app_test postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_test" >> "$GITHUB_ENV"
      - name: Ejecutar los pasos del ci.yml generado
        run: python3 tools/run_ci_locally.py "$RUNNER_TEMP/proj" --venv "$RUNNER_TEMP/venv"
      - name: Evals del hook del proyecto
        run: python3 "$RUNNER_TEMP/proj/evals/run_hook_evals.py"
      - name: Liberar el puerto de la base antes de compose
        if: matrix.db
        run: docker rm -f pg
      - name: Lint del Dockerfile (hadolint)
        run: |
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$RUNNER_TEMP/proj/Dockerfile"
      - name: Construir la imagen
        run: docker build -t e2e-app "$RUNNER_TEMP/proj"
      - name: Levantar con docker compose y comprobar /health
        working-directory: ${{ runner.temp }}/proj
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ matrix.port }}/health"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = 1 ] && [ "${{ matrix.db }}" = "true" ]; then
            # La app guarda en Postgres: crear un item y leerlo prueba migraciones + conexion de punta a punta.
            curl -fsS -X POST "http://localhost:${{ matrix.port }}/items" -H 'content-type: application/json' \
              -d '{"name":"e2e","quantity":1}' || ok=0
            curl -fsS "http://localhost:${{ matrix.port }}/items" | tee /dev/stderr | grep -q '"e2e"' || ok=0
          fi
          docker compose logs --no-color | tail -30
          echo '--- primeras lineas de la app (sin /health) ---'
          docker compose logs --no-color app | grep -v '"GET /health' | head -40 | cut -c1-400
          docker compose down -v
          test "$ok" = 1
