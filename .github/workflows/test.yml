name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s tests -v
      - name: Fuentes de versiones accesibles (consulta en vivo, no escribe)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/update_versions.py --strict
